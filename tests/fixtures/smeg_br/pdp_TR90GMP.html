s complexas. O ventilador est&aacute; ativo e o calor vem de baixo e de cima ao mesmo tempo. Cozinhar de forma mais r&aacute;pida e homog&ecirc;nea, deixando os alimentos mais secos por fora e &uacute;midos por dentro. Ideal para massas assadas, biscoitos, assados e cobblers. Ventila&ccedil;&atilde;o Circulaire: Perfeita para cozinhar pratos de maneira mais delicada. O calor vem da parte traseira do forno e &eacute; distribu&iacute;do de maneira r&aacute;pida e uniforme. O ventilador est&aacute; ativo. Ideal para cozinhar em v&aacute;rios n&iacute;veis sem misturar cheiros e sabores. Circulaire ECO: Cozinha de baixo consumo energ&eacute;tico: fun&ccedil;&atilde;o especialmente adequada para cozinhar em uma prateleira com baixo consumo de energia. Recomendada para todos os tipos de alimentos, exceto os que geram muita umidade (como vegetais). Para maior economia de energia, recomenda-se colocar os alimentos no forno sem pr&eacute;-aquecer o compartimento de cozimento. Meia grelha ECO: Para cozimento r&aacute;pido e douramento dos alimentos. Melhores resultados podem ser obtidos utilizando a prateleira superior para itens menores, e prateleiras inferiores para itens maiores, como costeletas ou salsichas. Para meia grelha, o calor &eacute; gerado apenas no centro do elemento, sendo ideal para por&ccedil;&otilde;es menores. Grelha pequena: Calor muito intenso vindo apenas de cima por meio de um elemento de aquecimento duplo. O ventilador n&atilde;o est&aacute; ativo. Oferece excelentes resultados de grelhado e gratinado. Usado no final do cozimento, proporciona uma colora&ccedil;&atilde;o uniforme aos pratos. Grelha grande com ventilador: Calor muito intenso vindo apenas de cima por meio de um elemento de aquecimento duplo. O ventilador est&aacute; ativo. Permite o grelhamento ideal de carnes mais grossas. Ideal para cortes grandes de carne. Grelha com ventilador (grande): Calor vindo apenas da parte inferior da cavidade. O ventilador n&atilde;o est&aacute; ativo. Ideal ra selar carnes ou assar com delicadeza, o TR90GMP entrega o equil&iacute;brio ideal entre for&ccedil;a e precis&atilde;o. Com um forno el&eacute;trico vers&aacute;til e queimadores robustos, ele atende desde receitas simples at&eacute; prepara&ccedil;&otilde;es mais elaboradas com facilidade.<\/p>\n<\/div>\n<\/div>\n<hr class=\"estilo-hr\" \/><\/div>\n<p><strong>Tipo<\/strong><\/p>\n<p>Tipo: Instala&ccedil;&atilde;o em coluna<br \/> Vapor Clean: Fun&ccedil;&atilde;o simples de limpeza usando vapor para soltar dep&oacute;sitos na cavidade do forno.<\/p>\n<p>Fam&iacute;lia do Produto: Fog&atilde;o<br \/> Tamanho do Fog&atilde;o: 90x60 cm<br \/> Configura&ccedil;&atilde;o do Fog&atilde;o: Dual fuel (g&aacute;s + el&eacute;trico)<br \/> Tipo de Fog&atilde;o: G&aacute;s<br \/> Tipo de Energia do Fog&atilde;o: G&aacute;s<br \/> N&uacute;mero de Fornos: 1<br \/> Tipo de Forno Principal: Termo-ventilado<br \/> Posi&ccedil;&atilde;o de Instala&ccedil;&atilde;o do Aparelho: Livre instala&ccedil;&atilde;o, Classe 1, Embutido, Classe 2-1 norma UNI EN 30-1-1<br \/> Sistema de Limpeza: Vapor Clean<\/p>\n<p><strong>Est&eacute;tica<\/strong><\/p>\n<p>Suportes de panela de ferro fundido pesados: para m&aacute;xima estabilidade e resist&ecirc;ncia.<br \/> Controles de Bot&otilde;es:<br \/> Cor: Creme<br \/> Design: Victoria<br \/> Acabamento: Brilhante<br \/> Est&eacute;tico: Victoria<br \/> Acabamento do Painel de Comando: Metal esmaltado<br \/> Material: Esmaltado<br \/> Upstand: Sim<br \/> Cor do Fog&atilde;o: Esmalte preto<br \/> Tipo de Suportes de Panela: Ferro fundido<br \/> Tipo de Controle de Fog&atilde;o: Bot&otilde;es de controle<br \/> Tipo de Bot&otilde;es de Controle: Smeg Victoria<br \/> Cor dos Controles: A&ccedil;o inoxid&aacute;vel<br \/> N&uacute;mero de Controles: 8<br \/> Nome do Display: 5 bot&otilde;es eletr&ocirc;nicos<br \/> Porta: Com moldura<br \/> Tipo de Vidro: Preto<br \/> Al&ccedil;a: Smeg Victoria<br \/> Cor da Al&ccedil;a: Cromo polido<br \/> Compart  e douramento dos alimentos. Melhores resultados podem ser obtidos utilizando a prateleira superior para itens menores, e prateleiras inferiores para itens maiores, como costeletas ou salsichas. Para meia grelha, o calor &eacute; gerado apenas no centro do elemento, sendo ideal para por&ccedil;&otilde;es menores.<br \/> Grelha pequena: Calor muito intenso vindo apenas de cima por meio de um elemento de aquecimento duplo. O ventilador n&atilde;o est&aacute; ativo. Oferece excelentes resultados de grelhado e gratinado. Usado no final do cozimento, proporciona uma colora&ccedil;&atilde;o uniforme aos pratos.<br \/> Grelha grande com ventilador: Calor muito intenso vindo apenas de cima por meio de um elemento de aquecimento duplo. O ventilador est&aacute; ativo. Permite o grelhamento ideal de carnes mais grossas. Ideal para cortes grandes de carne.<br \/> Grelha com ventilador (grande): Calor vindo apenas da parte inferior da cavidade. O ventilador n&atilde;o est&aacute; ativo. Ideal para tortas doces e salgadas, cobblers e pizzas. Projetado para finalizar o cozimento e tornar os alimentos mais crocantes.<br \/> Base assistida por ventilador: A mistura de ventilador e aquecimento inferior permite terminar o cozimento de alimentos que j&aacute; est&atilde;o cozidos na superf&iacute;cie, mas n&atilde;o no interior, mais rapidamente. Ideal para qualquer tipo de alimento.<\/p>\n<p><strong>Fun&ccedil;&otilde;es de Limpeza<\/strong><\/p>\n<p>Vapor Clean: Fun&ccedil;&atilde;o simples de limpeza usando vapor para soltar dep&oacute;sitos na cavidade do forno.<\/p>\n<p>Op&ccedil;&otilde;es do Forno Principal<br \/> Timer: Sim<br \/> Alarme ac&uacute;stico de fim de cozimento: Sim<br \/> Temperatura M&iacute;nima: 50 &deg;C<br \/> Temperatura M&aacute;xima: 260 &deg;C<\/p>\n<p><strong>Caracter&iacute;sticas T&eacute;cnicas do Fog&atilde;o<\/strong><\/p>\n<p>Queimadores ultra r&aacute;pidos: Potentes queimadores ultra r&aacute;pidos oferecem at&eacute; 5 kW de pot&ecirc;ncia.<br \/
