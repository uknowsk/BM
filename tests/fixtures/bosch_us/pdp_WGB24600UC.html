 10kg, you have fewer loads to do and more time to enjoy life.\"},{\"@type\":\"PropertyValue\",\"name\":\"In a hurry? Use SuperQuick 15/30™ for a fast wash\",\"value\":\"SuperQuick 15/30™ option features a 30 minute quick wash cycle or 15 minutes with the SpeedPerfect® option, that can be used on any small, lightly soiled load.\"},{\"@type\":\"PropertyValue\",\"name\":\"ActiveWater™ Plus\",\"value\":\"ActiveWater™ Plus automatically adjusts water consumption according to the load size using automatic load detection technology.\"},{\"@type\":\"PropertyValue\",\"name\":\"Stainless Steel Drum\",\"value\":\"Wave-shaped structured stainless-steel drum delivers a powerful, yet gentle wash.\"},{\"@type\":\"PropertyValue\",\"name\":\"Interior Drum LED Light\",\"value\":\"Interior drum LED light allows you to view your clothes easily.\"},{\"@type\":\"PropertyValue\",\"name\":\"Easily find and select the program you want.\",\"value\":\"The user-friendly Comfort Control touch control panel allows you to quickly and easily find the program you need. Ergonomically located and tilted towards you on the machine’s front, the large, stylish control panel illuminates when you turn on the appliance and guides you to the right program or function. So you can start the machine with ease and move on to other tasks.\"},{\"@type\":\"PropertyValue\",\"name\":\"AquaStop® Plus\",\"value\":\"AquaStop® Plus provides protection against water damage with 24 hour leak detection.\"},{\"@type\":\"PropertyValue\",\"name\":\"Laundry with Home Connect®\",\"value\":\"With the Home Connect™ app, receive cycle status notifications or remote start your washer and dryer all on your smartphone.\"}]}}]\n"])</script><script>self.__next_f.push([1,"3c:[\"$\",\"$L3e\",null,{\"children\":\"$L3f\"}]\n"])</script><script>self.__next_f.push([1,"40:I[79334,[\"12545\",\"static/chunks/c16f53c3-ffa0e0f20d988207.js\",\"76979\",\"static/chunks/swiper-9842cab093f6168a.js\",\"86201\",\"static/chunks/86201-4dc3c96bbba7a638.js
