# Legacy flat list (used by the Streamlit app.py only). The API's two-level tree lives in catalog.CATEGORY_TREE.
# Product groups. Only enabled ones can be searched; others show as "coming soon".
categories:
  - key: refrigerator
    label: 냉장고 (Refrigerator)
    enabled: true
  - key: washing_machine
    label: 세탁기 (Washing machine)
    enabled: false
  - key: vacuum
    label: 청소기 (Vacuum)
